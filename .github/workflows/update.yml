name: daily-update
on:
  schedule: [{cron: "17 4 * * *"}]
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [pipeline/**, update.sh, sources/**, .github/workflows/update.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get install -y zstd
      - run: pip install -r requirements.txt
      - run: ./update.sh
      - run: gzip -9 -k -f data/anime.jsonl
      - name: Release-Dateien veröffentlichen (Tag "latest", wird jeden Tag überschrieben)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AnimeDB (aktuell)
          files: |
            data/anime.jsonl
            data/anime.jsonl.gz
